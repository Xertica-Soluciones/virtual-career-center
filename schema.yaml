x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: '1.0.1'
  publishedVersionMetadata:
    releaseNote: >
      Security patch: upgraded golang.org/x/crypto to v0.35.0 (CVE-2024-45337 fix).
    releaseTypes:
      - Security
    recommended: true

  images:
    vcc:
      properties:
        com.googleapis.cloudmarketplace.product.service.name: "virtual-career-center"
        com.googleapis.cloudmarketplace.product.service.version: "1.0.1"
        com.googleapis.cloudmarketplace.product.service.image: "gcr.io/xertica-vcc-public/virtual-career-center/vcc:1.0.1"
        vcc:
          type: FULL
    ubbagent:
      properties:
        com.googleapis.cloudmarketplace.product.service.name: "ubbagent"
        com.googleapis.cloudmarketplace.product.service.version: "1.0.1"
        com.googleapis.cloudmarketplace.product.service.image: "gcr.io/xertica-vcc-public/ubbagent:1.0.1"
        ubbagent:
          type: FULL

properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE
  replicas:
    type: integer
    title: Number of Replicas
    default: 1
  vcc:
    type: string
  ubbagent:
    type: string
  reportingSecret:
    type: string
    x-google-marketplace:
      type: REPORTING_SECRET

required:
  - name
  - namespace
  - replicas
